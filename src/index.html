<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>EventsByAnand</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <!-- HIDDEN NETLIFY BUILD FORM -->
    <!-- Netlify's crawler needs to detect this static HTML during the build process -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="date" name="event-date" />
      <select name="event-type">
        <option value="Wedding Celebration">Wedding Celebration</option>
        <option value="Private Gala / Party">Private Gala / Party</option>
        <option value="Corporate Event">Corporate Event</option>
      </select>
      <textarea name="message"></textarea>
    </form>

    <app-root></app-root>
  </body>
</html>
